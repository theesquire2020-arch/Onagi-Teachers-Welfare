const getTheme=()=>{try{return localStorage.getItem('onagi-theme')==='dark'?'dark':'light'}catch(e){return 'light'}};

const useLiveBridge=()=>!!window.ONAGI_PREVIEW&&!sessionStorage.getItem('onagi-demo-mode');
const call=(name,payload={})=>useLiveBridge()?fetch('/api/gas',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:name,payload,token:auth?.token||''})}).then(r=>r.json()).catch(()=>({success:false,message:'Could not reach the live application. Please try again.',data:null})):new Promise(resolve=>{google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>resolve({success:false,message:e.message||String(e)}))[name](payload,auth?.token||'')});

async function enableDemo(){sessionStorage.setItem('onagi-demo-mode','1');const r=await call('login',{email:'amina.hassan@example.com',password:'demo123456'});if(!check(r))return;auth=r.data;sessionStorage.setItem('onagiSession',JSON.stringify(auth));sessionStorage.setItem('onagiSessionOrigin','demo');enter();notify('Sample demo opened. No live Google Sheet data is used.')}

function enter(){if(!auth)return;$('#auth').hidden=true;$('#app').hidden=false;if($('#previewPill'))$('#previewPill').textContent=useLiveBridge()?'LIVE APPLICATION · GOOGLE SHEETS':'SAMPLE DATA · DEMO';$('#userName').textContent=auth.member.FullName;$('#userRole').textContent=auth.role;$('#avatar').textContent=auth.member.FullName.split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase();$('#today').textContent=new Date().toLocaleDateString('en-KE',{weekday:'long',day:'numeric',month:'long',year:'numeric'});if(!$('#databaseBadge'))document.querySelector('.top-right').insertAdjacentHTML('afterbegin','<button class="database-badge" id="databaseBadge" onclick="refreshConnection(true)" title="Test database connection"><i></i>CHECKING DATABASE</button><button class="mobile-logout" onclick="signOut()">Sign out</button>');renderNav();navigate('dashboard');refreshConnection(true)}
async function refreshConnection(showNotice){const badge=$('#databaseBadge');if(!badge||!auth)return;badge.innerHTML='<i></i>CHECKING DATABASE';badge.className='database-badge checking';const r=await call('testConnection');if(!auth||!badge.isConnected)return;const connected=r.success&&r.data?.connected,demo=!!window.ONAGI_PREVIEW&&!useLiveBridge();badge.className='database-badge '+(demo?'demo':connected?'':'unavailable');badge.innerHTML='<i></i>'+esc(demo?'DEMO DATABASE':connected?'LIVE · '+r.data.databaseName:'DATABASE OFFLINE');badge.title=r.success?(r.data.databaseName+' · '+r.message):r.message;if(showNotice)notify(connected?'✓ Connected to '+r.data.databaseName+' · '+r.data.tabCount+' tabs verified.':r.message,!r.success||(!connected&&!demo));return r}
async function signOut(){if(auth)await call('logout');auth=null;sessionStorage.removeItem('onagiSession');sessionStorage.removeItem('onagiSessionOrigin');sessionStorage.removeItem('onagi-demo-mode');if($('#previewPill'))$('#previewPill').textContent='LIVE APPLICATION · GOOGLE SHEETS';$('#app').hidden=true;$('#auth').hidden=false;showAuth('login')}

const badge=s=>`<span class="badge ${String(s).toLowerCase()}">${esc(s)}</span>`;

async function printReport(){const r=await call('getSettings');if(!check(r))return;const s=r.data;$('#printBrand')?.remove();$('#printFooter')?.remove();const logo=s.logoUrl?`<img src="${esc(s.logoUrl)}" alt="Association logo">`:'<div class="brand-icon">✦</div>';$('#content').insertAdjacentHTML('afterbegin',`<div class="print-brand" id="printBrand">${logo}<div><h2>${esc(s.associationName||'Onagi Teachers Welfare')}</h2><p>${esc(s.postalAddress||'Coast Region, Kenya')} · ${esc(s.contactPhone||'')}</p><p>${esc(NAV.find(x=>x[0]===panel)?.[2]||'Report')} · ${date(new Date())}</p></div></div>`);$('#content').insertAdjacentHTML('beforeend',`<div class="print-brand print-footer" id="printFooter">${esc(s.printFooter||'Together, we grow stronger.')}</div>`);setTimeout(()=>window.print(),250)}

if(type==='manual'){title='Record '+activeFund+' contribution';action='addMemberContribution';fields=selectMember+`<input type="hidden" name="category" value="${esc(activeFund)}">${selectBeneficiary}${activeFund==='Saving'?'<p class="muted">Saving period is assigned automatically from the weekly/monthly setting.</p>':field('period','Period','month')}${field('amount','Amount (KES)','number','min="1" step="0.01"')}<p class="muted">A unique receipt reference is generated automatically when you save.</p>`}
if(type==='bonus'){title='Award bonus';action='awardBonus';fields=selectMember+`${field('amount','Amount (KES)','number','min="1" step="0.01"')}${field('reason','Reason')}`}
if(type==='expenditure'){title='Record expenditure';action='addExpenditure';fields=`<label>Fund<select name="category" required><option value="">Select fund</option>${[...FUNDS,'Other'].map(f=>`<option>${esc(f)}</option>`).join('')}</select></label>${field('amount','Amount (KES)','number','min="1" step="0.01"')}${field('purpose','Purpose')}<label>Beneficiary or payee (optional)<input name="beneficiaryName" placeholder="Name of payee"></label><p class="muted">An expenditure reference is created automatically when saved.</p>`}
if(type==='beneficiary'){title='Add '+activeFund+' beneficiary';action='addBeneficiary';fields=`<input type="hidden" name="category" value="${esc(activeFund)}">${auth.role==='Member'?'':selectMember}${field('fullName','Full name')}${field('relationship','Relationship')}${field('phone','Phone','tel')}`}
if(type==='gallery'){title='Add to gallery';action='addGalleryItem';fields=`${field('title','Title')}${field('imageUrl','Image URL','url','placeholder="https://"')}${field('description','Description')}`}
if(type==='document'){title='Add document';action='addDocument';fields=`${field('title','Title')}${field('fileUrl','File URL','url','placeholder="https://"')}${field('category','Category')}<label>Visibility<select name="visibility"><option>All</option><option>Staff</option></select></label>`}
if(type==='member'){const m=(cache.members||[]).find(x=>x.MemberID===id);if(!m)return;title='Manage '+m.FullName;action='updateMember';fields=`<input name="memberId" value="${esc(id)}" type="hidden"><label>Status<select name="status"><option ${m.Status==='Active'?'selected':''}>Active</option><option ${m.Status==='Inactive'?'selected':''}>Inactive</option></select></label>${auth.role==='SuperAdmin'?`<label>Role<select name="role"><option ${m.Role==='Member'?'selected':''}>Member</option><option ${m.Role==='Admin'?'selected':''}>Admin</option></select></label>`:''}`}
$('#modalHost')?.remove();const host=document.createElement('div');host.id='modalHost';host.className='modal-backdrop';host.onclick=e=>{if(e.target===host)host.remove()};host.innerHTML=`<div class="modal"><h2>${esc(title)}</h2><p>${esc(extra||'Complete the details below to continue.')}</p><form onsubmit="saveForm(event,'${action}')">${fields}<div class="modal-actions"><button type="button" class="outline" onclick="$('#modalHost').remove()">Cancel</button><button class="primary" type="submit">Confirm →</button></div></form></div>`;document.body.append(host);if(type==='payment'){host.querySelector('[name=loanId]').required=false;host.querySelector('[name=kind]').onchange=()=>{const repay=host.querySelector('[name=kind]').value==='repayment',period=host.querySelector('[name=period]'),beneficiary=host.querySelector('[name=beneficiaryId]');period.closest('label').hidden=repay||activeFund==='Saving';host.querySelector('[name=loanId]').closest('label').hidden=!repay;period.required=!repay&&activeFund!=='Saving';host.querySelector('[name=loanId]').required=repay;if(beneficiary){beneficiary.closest('label').hidden=repay;beneficiary.required=!repay}};host.querySelector('[name=kind]').onchange()}}
async function saveForm(e,action){e.preventDefault();const btn=e.target.querySelector('[type=submit]');btn.disabled=true;const data=Object.fromEntries(new FormData(e.target));if(data.period)data.period=data.period.slice(0,7);const r=await call(action,data);btn.disabled=false;if(!check(r))return;notify(r.message);$('#modalHost')?.remove();await navigate(panel);if(action==='switchDatabase')refreshConnection(false)}
async function reviewLoan(loanId,approve){if(!confirm((approve?'Approve':'Decline')+' this loan?'))return;const r=await call('approveLoan',{loanId,approve});if(check(r)){notify(r.message);navigate('loans')}}
Object.keys(COUNTIES).forEach(x=>$('#county').insertAdjacentHTML('beforeend',`<option>${esc(x)}</option>`));
try{if(window.ONAGI_PREVIEW&&!sessionStorage.getItem('onagi-demo-mode')&&sessionStorage.getItem('onagiSessionOrigin')!=='live')sessionStorage.removeItem('onagiSession');auth=JSON.parse(sessionStorage.getItem('onagiSession')||'null');if(auth)enter()}catch(e){sessionStorage.removeItem('onagiSession')}
</script>
